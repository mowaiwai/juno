# Juno 单机部署编排（PostgreSQL + FastAPI + nginx SPA）
#
# 部署步骤：
#   1. 在本目录创建 .env（至少包含 JUNO_SECRET_KEY；可用 `openssl rand -hex 32` 生成）
#   2. （仅首次）在 .env 中填写 JUNO_INIT_TENANT_NAME / JUNO_INIT_ADMIN_NAME /
#      JUNO_INIT_ADMIN_EMAIL / JUNO_INIT_ADMIN_PASSWORD，启动后自动创建首个租户与管理员
#   3. docker compose up -d --build
#   4. 浏览器打开 http://服务器IP ；生产环境在前置负载均衡/网关上终结 HTTPS
#
# .env 支持的变量（均可用默认值，除 JUNO_SECRET_KEY 外）：
#   JUNO_SECRET_KEY               必填，JWT 签名密钥
#   POSTGRES_USER/PASSWORD/DB     数据库账号，默认均为 juno
#   JUNO_CORS_ORIGINS             跨域来源，默认空（前端同源反代，无需配置）
#   JUNO_LLM_API_KEY              大模型密钥，不填则 AI 功能不可用
#   JUNO_LLM_MODEL / JUNO_LLM_BASE_URL
#   JUNO_SCHEDULER_ENABLED        内置每日调度，默认 true
#   JUNO_INIT_TENANT_NAME 等四项  首个租户/管理员初始化（创建后可从 .env 删除）
#   WEB_PORT                      前端宿主端口，默认 80

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-juno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juno}
      POSTGRES_DB: ${POSTGRES_DB:-juno}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juno} -d ${POSTGRES_DB:-juno}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    restart: "no"
    command: >
      sh -c "alembic upgrade head && python -m app.services.bootstrap"
    environment:
      JUNO_DATABASE_URL: &db_url postgresql+psycopg://${POSTGRES_USER:-juno}:${POSTGRES_PASSWORD:-juno}@db:5432/${POSTGRES_DB:-juno}
      JUNO_INIT_TENANT_NAME: ${JUNO_INIT_TENANT_NAME:-}
      JUNO_INIT_ADMIN_NAME: ${JUNO_INIT_ADMIN_NAME:-}
      JUNO_INIT_ADMIN_EMAIL: ${JUNO_INIT_ADMIN_EMAIL:-}
      JUNO_INIT_ADMIN_PASSWORD: ${JUNO_INIT_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      JUNO_SECRET_KEY: ${JUNO_SECRET_KEY:?请在 .env 中设置 JUNO_SECRET_KEY}
      JUNO_DATABASE_URL: *db_url
      JUNO_CORS_ORIGINS: ${JUNO_CORS_ORIGINS:-}
      JUNO_STORAGE_DIR: /app/storage
      JUNO_LLM_API_KEY: ${JUNO_LLM_API_KEY:-}
      JUNO_LLM_MODEL: ${JUNO_LLM_MODEL:-qwen-plus}
      JUNO_LLM_BASE_URL: ${JUNO_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      JUNO_SCHEDULER_ENABLED: ${JUNO_SCHEDULER_ENABLED:-true}
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./prototype
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  pgdata:
  storage:
